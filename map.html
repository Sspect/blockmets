<!DOCTYPE html>
<html data-bs-theme="dark" lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/png" href="assets/img/icons/map-icon.png">
	<title>BlockMets - Map</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/global.css" rel="stylesheet">
	<link href="css/texture-background.css" rel="stylesheet">
	<link href="css/header.css" rel="stylesheet">

<body class="bg-body text-body">
	<div id="header" class="sticky-top"></div>

	<main class="container text-center py-5">

			<div class="card-body p-4 p-lg-5">
				<div class="map-link-grid" role="list" aria-label="Map destinations">
					<article class="map-link-column" role="listitem">
						<a class="map-link-tile map-link-tile--bluemap"
							href="http://oslo25.spillvert.no:25665/#blockmets2025:7154:0:1738:1500:0:0:0:0:perspective"
							target="_blank" rel="noopener noreferrer" aria-label="Open BlueMap in a new tab">
							<img class="map-link-logo" src="assets/img/map-page/bluemap-logo.png" alt="BlueMap logo">
						</a>
						<p class="map-link-description mt-3 mb-0">If BlueMap is lagging, try to <a
								href="https://www.google.com/search?q=turn+on+hardware+acceleration+in+browser&rlz=1C1PNKB_enNO1072NO1072&oq=turn+on+hardware+acceleration+in+browser&gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIICAEQABgWGB4yCggCEAAYChgWGB4yCggDEAAYChgWGB4yCAgEEAAYFhgeMgoIBRAAGAoYFhgeMggIBhAAGBYYHjIGCAcQRRg80gEHODA1ajBqNKgCALACAQ&sourceid=chrome&ie=UTF-8"
								target="_blank" rel="noopener noreferrer">turn on hardware acceleration</a>.</p>
					</article>

					<article class="map-link-column" role="listitem">
						<a class="map-link-tile map-link-tile--chunkbase"
							href="https://www.chunkbase.com/apps/seed-map#seed=8120773545045283206&amp;platform=java_1_21_6&amp;dimension=overworld&amp;x=6568&amp;z=1189&amp;zoom=0.126"
							target="_blank" rel="noopener noreferrer" aria-label="Open Chunkbase in a new tab">
							<img class="map-link-logo" src="assets/img/map-page/chunkbase-logo.png" alt="Chunkbase logo">
						</a>
						<p class="map-link-description mt-3 mb-0">Looking for a specific biome or structure? Use Chunkbase to find the nearest one!</p>
						<p class="map-link-description mb-0">Seed: Not generated yet</p>
					</article>
				</div>
			</div>

		</section>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
